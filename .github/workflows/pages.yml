# Publie le site sur GitHub Pages.
#
# Le dépôt EST le site : une page, ses modules dans /js/.
#
# La publication n'a lieu que si les tests passent : une étude fausse est pire
# qu'un site indisponible — celui qui la paie s'en apercevra sur sa facture.

name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verifier:
    name: Tests du moteur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exécuter les tests
        run: npm test

  publier:
    name: Assembler et publier
    needs: verifier
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assembler le site
        run: |
          mkdir -p _site
          # Tout le dépôt est publiable, sauf l'outillage de développement.
          # Les tests et l'outillage de développement ne se publient pas :
          # le site n'en a pas besoin, et les servir ne ferait qu'alourdir.
          # `docs/` reste au dépôt et ne part pas en ligne : ce sont des
          # documents de développement, et SECURITE.md nomme ce qui n'est pas
          # encore protégé. La transparence due au visiteur est ailleurs — le
          # site affiche lui-même ses hypothèses et la provenance de chaque
          # chiffre.
          rsync -a --exclude '/_site' --exclude '.git' --exclude '.github' \
                   --exclude 'tests' --exclude 'package.json' \
                   --exclude 'node_modules' --exclude 'docs' \
                   ./ _site/
          touch _site/.nojekyll
          echo "Contenu publié :"
          find _site -maxdepth 2 -type d | sort

      # GitHub Pages doit être activé une fois à la main :
      # Settings → Pages → Source → GitHub Actions.
      # `enablement: true` a été essayé et échoue même sur un dépôt public — le
      # jeton d'un workflow n'a jamais le droit de créer un site Pages
      # (« Create Pages site failed. Resource not accessible by integration »).
      # Sans cette option, le message d'erreur dit clairement quoi faire.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
