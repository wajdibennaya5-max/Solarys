# Publie le site sur GitHub Pages.
#
# Le dépôt EST le site :
#   /       la vitrine commerciale
#   /app/   l'application Solarys
#
# La publication n'a lieu que si les tests du moteur de calcul passent : un
# outil de dimensionnement faux est pire qu'un outil indisponible.

name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verifier:
    name: Tests du moteur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exécuter les tests
        working-directory: app
        run: npm test

  publier:
    name: Assembler et publier
    needs: verifier
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assembler le site
        run: |
          mkdir -p _site
          # Tout le dépôt est publiable, sauf l'outillage de développement.
          # `tools/` est l'outillage du vendeur, pas du site : il n'a rien à
          # faire sur la vitrine. Cela ne change rien au modèle de sécurité —
          # `makeKey` est de toute façon livré dans app/js/licence.js, qui le
          # dit lui-même : la licence est une commodité, pas une protection.
          rsync -a --exclude '/_site' --exclude '.git' --exclude '.github' \
                   --exclude 'app/tests' --exclude 'app/package.json' \
                   --exclude 'app/node_modules' --exclude 'app/README.md' \
                   --exclude 'tools' --exclude 'docs' \
                   ./ _site/
          touch _site/.nojekyll
          echo "Contenu publié :"
          find _site -maxdepth 2 -type d | sort

      # GitHub Pages doit être activé une fois à la main :
      # Settings → Pages → Source → GitHub Actions.
      # `enablement: true` a été essayé et échoue même sur un dépôt public — le
      # jeton d'un workflow n'a jamais le droit de créer un site Pages
      # (« Create Pages site failed. Resource not accessible by integration »).
      # Sans cette option, le message d'erreur dit clairement quoi faire.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
