<!doctype html>
<html lang="fr" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solarys — Dimensionnement photovoltaïque</title>
<meta name="description" content="Dimensionnement photovoltaïque professionnel : champ PV, onduleur, batteries, câblage, schéma unifilaire et étude économique. Fonctionne hors ligne.">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="./css/print.css" media="print">
</head>
<body>

<header class="topbar">
  <button class="icon-btn only-mobile" data-action="toggleNav" aria-label="Menu">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="./">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="7"/>
      <path d="M16 1v5M16 26v5M1 16h5M26 16h5M5.5 5.5l3.5 3.5M23 23l3.5 3.5M26.5 5.5 23 9M9 23l-3.5 3.5"/>
    </svg>
    <span class="brand-text"><b>Solarys</b><small>Dimensionnement PV</small></span>
  </a>

  <div class="topbar-actions">
    <select id="project-select" aria-label="Projet"></select>
    <button class="btn" data-action="new">+<span class="hide-sm"> Nouveau</span></button>
    <button class="btn primary" data-action="save">Enregistrer</button>
    <div class="menu">
      <button class="icon-btn" aria-label="Plus d'actions" data-action="menu">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
      </button>
      <div class="menu-list">
        <button data-action="new" class="only-compact">Nouveau projet</button>
        <button data-action="duplicate">Dupliquer</button>
        <button data-action="export">Exporter</button>
        <button data-action="import">Importer</button>
        <button data-action="print">Imprimer / PDF</button>
        <button data-action="delete" class="danger">Supprimer</button>
      </div>
    </div>
  </div>
</header>

<div class="layout">
  <nav id="nav" class="sidebar" aria-label="Sections"></nav>
  <div class="scrim" data-action="toggleNav" aria-hidden="true"></div>
  <main class="main">
    <h1 id="view-title" class="view-title"></h1>
    <div id="view" class="view"></div>
  </main>
</div>

<div id="flash" class="flash" role="status" aria-live="polite"></div>
<div id="print-area" class="print-only"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
